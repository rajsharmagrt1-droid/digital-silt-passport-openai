<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSP Staff</title><link rel="stylesheet" href="app.css"></head><body><header><div class="wrap nav"><div><div class="brand">Digital Silt Passport</div><div class="title">Staff Field Entry</div></div><button id="logout">Logout</button></div></header><main class="wrap"><div id="top" class="notice">Loading…</div><div class="grid"><section class="card"><h2>Add Field Record</h2><form id="form"><label>Reach<select id="reach" required></select></label><div class="formgrid"><label>Work Year<input id="year" required placeholder="1434 Rabi / 2026-27"></label><label>Cleaning Method<select id="method"><option>Manual</option><option>Mechanical</option><option>Site based</option></select></label><label>Chainage From (km)<input id="cf" type="number" step="0.001"></label><label>Chainage To (km)<input id="ct" type="number" step="0.001"></label><label>Silt Depth (cm)<input id="sd" type="number" step="0.01"></label><label>Controlled Scrapping (cm)<input id="sc" type="number" step="0.01" value="5"></label><label>Quantity<input id="qty" type="number" step="0.001"></label><label>Lead (m)<input id="lead" type="number" step="0.01"></label><label>Lift (m)<input id="lift" type="number" step="0.01"></label></div><label>Disposal Details<textarea id="disp"></textarea></label><label>Dressing Details<textarea id="dress"></textarea></label><label>Remarks<textarea id="remarks"></textarea></label><div class="formgrid"><label>Before Photo<input id="beforePhoto" type="file" accept="image/*"></label><label>During Photo<input id="duringPhoto" type="file" accept="image/*"></label><label>After Photo<input id="afterPhoto" type="file" accept="image/*"></label></div><button class="orange">Save Field Record + Photos</button><div id="msg"></div></form></section><section class="card"><h2>Recent Records</h2><div id="records" class="muted">Select a reach.</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
(async()=>{if(!await DSP.init()){DSP.msg(top,'error','Supabase configuration missing.');return}const u=await DSP.user(),p=await DSP.profile();if(!u||!p||!p.approved){location.href='login.html';return}top.textContent='Logged in: '+(p.full_name||u.email)+' • Approved Staff';logout.onclick=async()=>{await DSP.client.auth.signOut();location.href='login.html'};
const rs=await DSP.client.from('reaches').select('*').order('canal_name');reach.innerHTML=(rs.data||[]).map(r=>'<option value="'+DSP.esc(r.id)+'">'+DSP.esc(r.code)+' — '+DSP.esc(r.canal_name)+'</option>').join('');async function load(){const id=reach.value;const x=await DSP.client.from('field_records').select('*').eq('reach_id',id).order('created_at',{ascending:false}).limit(20);records.innerHTML='<table><tr><th>Year</th><th>Chainage</th><th>Qty</th><th>Method</th></tr>'+((x.data||[]).map(r=>'<tr><td>'+DSP.esc(r.work_year)+'</td><td>'+DSP.esc(r.chainage_from_km??'—')+'–'+DSP.esc(r.chainage_to_km??'—')+'</td><td>'+DSP.esc(r.quantity??'—')+'</td><td>'+DSP.esc(r.cleaning_method??'—')+'</td></tr>').join('')||'<tr><td colspan="4">No records.</td></tr>')+'</table>'}reach.onchange=load;await load();form.onsubmit=async e=>{e.preventDefault();const {data:record,error}=await DSP.client.from('field_records').insert({reach_id:reach.value,work_year:year.value,chainage_from_km:cf.value||null,chainage_to_km:ct.value||null,silt_depth_cm:sd.value||null,scrapping_cm:sc.value||null,quantity:qty.value||null,cleaning_method:method.value,lead_m:lead.value||null,lift_m:lift.value||null,disposal_details:disp.value||null,dressing_details:dress.value||null,remarks:remarks.value||null,recorded_by:u.id}).select().single();if(error){DSP.msg(msg,'error',error.message);return}
for(const [type,input] of [['BEFORE',beforePhoto],['DURING',duringPhoto],['AFTER',afterPhoto]]){const file=input.files[0];if(!file)continue;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=u.id+'/'+record.id+'-'+type+'-'+Date.now()+'-'+safe;const up=await DSP.client.storage.from('field-evidence').upload(path,file,{upsert:false});if(up.error){DSP.msg(msg,'error','Record saved, but '+type+' photo upload failed: '+up.error.message);return}const pr=await DSP.client.from('field_photos').insert({field_record_id:record.id,photo_type:type,storage_path:path,uploaded_by:u.id});if(pr.error){DSP.msg(msg,'error','Photo uploaded, metadata save failed: '+pr.error.message);return}}
DSP.msg(msg,'success','Field record and available photos saved.');form.reset();sc.value=5;await load()}})();</script></body></html>
