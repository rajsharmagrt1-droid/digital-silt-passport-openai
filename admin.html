<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSP Admin</title><link rel="stylesheet" href="app.css"></head><body><header><div class="wrap nav"><div><div class="brand">Digital Silt Passport</div><div class="title">Master Admin</div><div class="sub">Staff • Reaches • Verification • Audit</div></div><button id="logout">Logout</button></div></header><main class="wrap"><div id="msg"></div><div id="qrBox" class="card hidden"><h2>Reach QR</h2><div id="qrCode"></div><p id="qrUrl" class="muted"></p><button onclick="document.getElementById('qrBox').classList.add('hidden')">Close</button></div><div class="grid"><section class="card"><h2>Staff Approval</h2><div id="staffList">Loading…</div></section><section class="card"><h2>Reach Management</h2><form id="reachForm"><div class="formgrid"><label>Code<input id="code" required></label><label>Canal / Minor<input id="canal" required></label><label>Division<input id="division" value="Meerut"></label><label>Start RD (km)<input id="start" type="number" step="0.001"></label><label>End RD (km)<input id="end" type="number" step="0.001"></label><label>Status<select id="status"><option>Normal</option><option>Moderate</option><option>Heavy</option><option>Critical</option><option>Silt Hotspot</option></select></label><label>Priority<select id="priority"><option>Routine</option><option>Priority</option><option>Critical</option></select></label></div><label>Current Condition<textarea id="condition"></textarea></label><button class="orange">Add Reach</button></form><div id="reachList" style="margin-top:15px"></div></section><section class="card full"><h2>Audit Log</h2><div id="audit" class="muted">Loading…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
window.showQR=(id,code)=>{const url=new URL("passport.html?reach="+encodeURIComponent(id),location.href).href;document.getElementById("qrBox").classList.remove("hidden");document.getElementById("qrUrl").textContent=url;const box=document.getElementById("qrCode");box.innerHTML="";const canvas=document.createElement("canvas");box.appendChild(canvas);QRCode.toCanvas(canvas,url,{width:240,margin:2},()=>{})};(async()=>{if(!await DSP.init()){DSP.msg(msg,'error','Supabase configuration missing.');return}const u=await DSP.user(),p=await DSP.profile();if(!u||!p||!p.approved||p.role!=='admin'){location.href='login.html';return}logout.onclick=async()=>{await DSP.client.auth.signOut();location.href='login.html'};
async function load(){const s=await DSP.client.rpc('admin_list_staff');staffList.innerHTML='<table><tr><th>Name</th><th>Designation</th><th>Division</th><th>Role</th><th>Approved</th><th>Action</th></tr>'+((s.data||[]).map(x=>'<tr><td>'+DSP.esc(x.full_name)+'</td><td>'+DSP.esc(x.designation||'—')+'</td><td>'+DSP.esc(x.division||'—')+'</td><td>'+DSP.esc(x.role)+'</td><td>'+(x.approved?'<span class="badge-ok">YES</span>':'<span class="badge-no">NO</span>')+'</td><td><button onclick="toggleStaff(\''+x.user_id+'\','+(x.approved?'false':'true')+')">'+(x.approved?'Revoke':'Approve')+'</button></td></tr>').join('')||'<tr><td colspan="6">No staff profiles.</td></tr>')+'</table>';
const r=await DSP.client.from('reaches').select('*').order('canal_name');reachList.innerHTML='<table><tr><th>Code</th><th>Canal</th><th>RD</th><th>Status</th><th>Priority</th><th>QR</th></tr>'+((r.data||[]).map(x=>'<tr><td>'+DSP.esc(x.code)+'</td><td>'+DSP.esc(x.canal_name)+'</td><td>'+DSP.esc(x.start_rd_km)+'–'+DSP.esc(x.end_rd_km)+'</td><td>'+DSP.esc(x.status)+'</td><td>'+DSP.esc(x.priority)+'</td><td><div class="actions"><a class="btn secondary small" target="_blank" href="passport.html?reach='+encodeURIComponent(x.id)+'">Open</a><button class="small" onclick="showQR(''+x.id+'',''+DSP.esc(x.code)+'')">QR</button></div></td></tr>').join('')||'<tr><td colspan="6">No reaches.</td></tr>')+'</table>';
const a=await DSP.client.from('audit_log').select('*').order('created_at',{ascending:false}).limit(50);audit.innerHTML='<table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Table</th><th>Record</th></tr>'+((a.data||[]).map(x=>'<tr><td>'+DSP.esc(DSP.fmtDate(x.created_at))+'</td><td>'+DSP.esc(x.actor_id||'—')+'</td><td>'+DSP.esc(x.action)+'</td><td>'+DSP.esc(x.table_name)+'</td><td>'+DSP.esc(x.record_id||'—')+'</td></tr>').join('')||'<tr><td colspan="5">No audit records.</td></tr>')+'</table>'}
window.toggleStaff=async(id,val)=>{const {error}=await DSP.client.rpc('admin_set_staff_approval',{target_user_id:id,new_approved:val});if(error){DSP.msg(msg,'error',error.message);return}await load()};
reachForm.onsubmit=async e=>{e.preventDefault();const {error}=await DSP.client.from('reaches').insert({code:code.value,canal_name:canal.value,division:division.value,start_rd_km:start.value||null,end_rd_km:end.value||null,status:status.value,priority:priority.value,current_condition:condition.value||null});if(error){DSP.msg(msg,'error',error.message);return}DSP.msg(msg,'success','Reach added.');reachForm.reset();division.value='Meerut';await load()};
await load()})();</script></body></html>
