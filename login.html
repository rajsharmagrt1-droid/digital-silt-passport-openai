<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSP Login</title><link rel="stylesheet" href="app.css"></head><body><header><div class="wrap"><div class="brand">Digital Silt Passport</div><div class="title">Authorised Access</div><div class="sub">Approved Staff / Master Admin</div></div></header><main class="wrap"><div class="card" style="max-width:520px;margin:30px auto"><h2>Login</h2><p class="muted">Public QR view में login की आवश्यकता नहीं है। यह page केवल authorised users के लिए है।</p><form id="f"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Login</button><div id="msg"></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>(async()=>{if(!await DSP.init()){DSP.msg(document.getElementById('msg'),'error','Supabase configuration missing.');return}document.getElementById('f').onsubmit=async e=>{e.preventDefault();const {error}=await DSP.client.auth.signInWithPassword({email:email.value,password:password.value});if(error){DSP.msg(msg,'error',error.message);return}const p=await DSP.profile();if(!p||!p.approved){await DSP.client.auth.signOut();DSP.msg(msg,'error','Account approved नहीं है। Master Admin से approval आवश्यक है।');return}location.href=p.role==='admin'?'admin.html':'staff.html'}})();</script></body></html>
